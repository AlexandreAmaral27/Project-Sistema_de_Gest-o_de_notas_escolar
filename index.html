<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Escolar</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#2563eb;
  --success:#10b981;
  --danger:#ef4444;
  --dark:#111827;
  --glass: rgba(255,255,255,0.1);
}

*{ box-sizing:border-box; }

body{
  font-family:'Poppins',sans-serif;
  margin:0;
  background:linear-gradient(135deg,#1e3a8a,#2563eb);
  color:white;
  transition:0.4s;
  

}

.dark{
  background:var(--dark);
  color:#eee;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:70px;
  background: rgb(18 35 91);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  z-index:1100;
}
main{
  margin-left:250px;
  margin-top:70px; /* mesma altura do header */
  padding:20px;
  transition:0.3s;
}
@media(max-width:900px){

  .sidebar{
    left:-250px;
  }

  .sidebar.active{
    left:0;
  }

  main{
    margin-left:0;
  }

  .menu-toggle{
    display:block;
  }
}
.menu-toggle{
  display:none;
  font-size:22px;
  cursor:pointer;
}

.logo{
  font-weight:600;
}

.header-actions button{
  margin-left:10px;
}
 
/* BOTÕES */
button{
  background:var(--primary);
  border:none;
  padding:10px 15px;
  border-radius:8px;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
  opacity:0.9;
}

/* SIDEBAR */
.sidebar{
  width:230px;
  position:fixed;
  height:100%;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);
  padding-top:20px;
  transition:0.4s;
}

.sidebar button{
  display:block;
  width:100%;
  background:none;
  padding:15px;
  text-align:left;
  color:white;
}

.sidebar button:hover{
  background:rgba(255,255,255,0.1);
}

.sidebar.active{
  left:0;
}

main{
  margin-left:230px;
  padding:30px;
  transition:0.4s;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
}

.card{
  background:var(--glass);
  padding:25px;
  border-radius:20px;
  backdrop-filter:blur(15px);
  transition:0.4s;
}

.card:hover{
  transform:translateY(-5px);
}

/* FORM */
input{
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
  width:100%;
}

/* LISTAS */
.lista div{
  background:var(--glass);
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* LOGIN */
.login-container{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.login-box{
  background:var(--glass);
  padding:40px;
  border-radius:20px;
  backdrop-filter:blur(15px);
  width:90%;
  max-width:350px;
  text-align:center;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:var(--success);
  padding:15px 20px;
  border-radius:10px;
  opacity:0;
  transition:0.4s;
}

.toast.show{
  opacity:1;
}

/* RESPONSIVO */
@media(max-width:900px){
  .sidebar{
    left:-230px;
  }

  main{
    margin-left:0;
  }

  .menu-toggle{
    display:block;
  }
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:600;
  font-size:18px;
}

.logo-img{
  width:45px;
  height:45px;
  object-fit:contain;
  border-radius:8px;
}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="loginSection" class="login-container">
  <div class="login-box">
    <h2>🎓 Sistema Escolar</h2>
    <input type="text" id="usuario" placeholder="Usuário">
    <input type="password" id="senha" placeholder="Senha">
    <button onclick="login()">Entrar</button>
  </div>
</section>

<!-- SISTEMA -->
<div id="sistema" style="display:none;">

<header>
  <div class="menu-toggle" onclick="toggleMenu()">☰</div>
  <div class="logo">
  <img src="imagem/logo.jpeg" alt="Logo Colégio" class="logo-img">
  <span>Gestão Escolar</span>
</div>
  <div class="header-actions">
    <button onclick="logout()">Sair</button>
  </div>
</header>

<aside class="sidebar">
  <button onclick="mostrarSecao('dashboard')">📊 Dashboard</button>
  <button onclick="mostrarSecao('alunos')">👨‍🎓 Alunos</button>
  <button onclick="mostrarSecao('professores')">👩‍🏫 Professores</button>
  <button onclick="mostrarSecao('notas')">📝 Notas</button>
</aside>

<main>

<section id="dashboard">
  <h2>Visão Geral</h2>
  <div class="cards">
    <div class="card">
      <h3>Total Alunos</h3>
      <p id="totalAlunos">0</p>
    </div>
    <div class="card">
      <h3>Média Geral</h3>
      <p id="mediaGeral">0</p>
    </div>
  </div>
  <canvas id="graficoNotas"></canvas>
</section>

<section id="alunos" style="display:none;">
  <h2>Cadastro de Alunos</h2>
  <form onsubmit="cadastrarAluno(event)">
    <input type="text" id="nomeAluno" placeholder="Nome" required>
    <input type="text" id="matriculaAluno" placeholder="Matrícula" required>
    <button type="submit">Cadastrar</button>
  </form>
  <div id="listaAlunos" class="lista"></div>
</section>

<section id="professores" style="display:none;">
  <h2>Cadastro de Professores</h2>
  <form onsubmit="cadastrarProfessor(event)">
    <input type="text" id="nomeProfessor" placeholder="Nome" required>
    <input type="text" id="disciplinaProfessor" placeholder="Disciplina" required>
    <button type="submit">Cadastrar</button>
  </form>
  <div id="listaProfessores" class="lista"></div>
</section>

<section id="notas" style="display:none;">
  <h2>Lançamento de Notas</h2>
  <form onsubmit="lancarNotas(event)">
    <input type="text" id="alunoNota" placeholder="Nome do aluno" required>
    <input type="number" id="nota1" placeholder="Nota 1" required>
    <input type="number" id="nota2" placeholder="Nota 2" required>
    <button type="submit">Salvar</button>
  </form>
  <div id="listaNotas" class="lista"></div>
</section>
<button onclick="limparTudo()" style="background:#ef4444;margin-top:15px;">
  🗑️ Limpar Tudo
</button>
<button onclick="exportarPDF()" style="margin-top:10px;">
  📁 Exportar PDF
</button>

</main>
</div>

<div id="toast" class="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const administradores = [
  { usuario: "Amaral", senha: "1234" },
  { usuario: "Sheldy Costa", senha: "2026" }
];

const loginSection = document.getElementById("loginSection");
const sistema = document.getElementById("sistema");
const usuarioInput = document.getElementById("usuario");
const senhaInput = document.getElementById("senha");
const listaAlunos = document.getElementById("listaAlunos");
const listaProfessores = document.getElementById("listaProfessores");
const listaNotas = document.getElementById("listaNotas");
const totalAlunos = document.getElementById("totalAlunos");
const mediaGeral = document.getElementById("mediaGeral");

let alunos = JSON.parse(localStorage.getItem("alunos")) || [];
let professores = JSON.parse(localStorage.getItem("professores")) || [];
let notas = JSON.parse(localStorage.getItem("notas")) || [];

/* LOGIN COM SESSÃO */
function login(){
  const user = usuarioInput.value;
  const pass = senhaInput.value;

  const valido = administradores.find(
    a => a.usuario.toLowerCase() === user.toLowerCase() && a.senha === pass
  );

  if(valido){
    localStorage.setItem("logado", "true");
    loginSection.style.display="none";
    sistema.style.display="block";
    inicializar();
  } else {
    showToast("Usuário ou senha incorretos!");
  }
}

function logout(){
  localStorage.removeItem("logado");
  location.reload();
}

/* MANTER SESSÃO */
window.onload = function(){
  if(localStorage.getItem("logado") === "true"){
    loginSection.style.display="none";
    sistema.style.display="block";
    inicializar();
  }
}

/* MENU */
function toggleMenu(){
  document.querySelector(".sidebar").classList.toggle("active");
}

/* SEÇÕES */
function mostrarSecao(id){
  document.querySelectorAll("main section").forEach(sec=>{
    sec.style.display="none";
  });
  document.getElementById(id).style.display="block";
}

/* TOAST */
function showToast(msg){
  const toast=document.getElementById("toast");
  toast.textContent=msg;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),3000);
}

/* INICIALIZA */
function inicializar(){
  renderAlunos();
  renderProfessores();
  renderNotas();
  atualizarDashboard();
}

/* ALUNOS */
function cadastrarAluno(e){
  e.preventDefault();
  const nome = document.getElementById("nomeAluno").value;
  const matricula = document.getElementById("matriculaAluno").value;

  alunos.push({nome, matricula});
  localStorage.setItem("alunos",JSON.stringify(alunos));
  renderAlunos();
  atualizarDashboard();
  e.target.reset();
  showToast("Aluno cadastrado!");
}

function renderAlunos(){
  listaAlunos.innerHTML="";
  alunos.forEach((a,i)=>{
    listaAlunos.innerHTML+=`
      <div>${a.nome} - ${a.matricula}
      <button onclick="removerAluno(${i})">❌</button></div>`;
  });
}

function removerAluno(i){
  alunos.splice(i,1);
  localStorage.setItem("alunos",JSON.stringify(alunos));
  renderAlunos();
  atualizarDashboard();
}

/* PROFESSORES */
function cadastrarProfessor(e){
  e.preventDefault();
  const nome = document.getElementById("nomeProfessor").value;
  const disciplina = document.getElementById("disciplinaProfessor").value;

  professores.push({nome, disciplina});
  localStorage.setItem("professores",JSON.stringify(professores));
  renderProfessores();
  e.target.reset();
  showToast("Professor cadastrado!");
}

function renderProfessores(){
  listaProfessores.innerHTML="";
  professores.forEach((p,i)=>{
    listaProfessores.innerHTML+=`
      <div>${p.nome} - ${p.disciplina}
      <button onclick="removerProfessor(${i})">❌</button></div>`;
  });
}

function removerProfessor(i){
  professores.splice(i,1);
  localStorage.setItem("professores",JSON.stringify(professores));
  renderProfessores();
}

/* NOTAS */
function lancarNotas(e){
  e.preventDefault();

  const aluno = document.getElementById("alunoNota").value;
  const nota1 = parseFloat(document.getElementById("nota1").value);
  const nota2 = parseFloat(document.getElementById("nota2").value);

  const media = (nota1 + nota2)/2;

  notas.push({aluno, media});
  localStorage.setItem("notas",JSON.stringify(notas));
  renderNotas();
  atualizarDashboard();
  e.target.reset();
  showToast("Notas lançadas!");
}

function renderNotas(){
  listaNotas.innerHTML="";
  notas.forEach((n,i)=>{
    listaNotas.innerHTML+=`
      <div>${n.aluno} - Média: ${n.media.toFixed(1)}
      <button onclick="removerNota(${i})">❌</button></div>`;
  });
}

function removerNota(i){
  notas.splice(i,1);
  localStorage.setItem("notas",JSON.stringify(notas));
  renderNotas();
  atualizarDashboard();
}

/* DASHBOARD */
function atualizarDashboard(){
  totalAlunos.textContent=alunos.length;

  let media=notas.length
    ? (notas.reduce((acc,n)=>acc+n.media,0)/notas.length).toFixed(1)
    : 0;

  mediaGeral.textContent=media;
  desenharGrafico();
}

/* GRÁFICO PROFISSIONAL */
function desenharGrafico(){
  const canvas=document.getElementById("graficoNotas");
  const ctx=canvas.getContext("2d");

  canvas.width=canvas.parentElement.offsetWidth;
  canvas.height=300;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle="rgba(255,255,255,0.2)";
  for(let i=1;i<=5;i++){
    let y = (canvas.height/5)*i;
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(canvas.width,y);
    ctx.stroke();
  }

  notas.forEach((n,i)=>{
    const altura=n.media*20;
    const x=i*70+40;
    const y=canvas.height-altura;

    ctx.fillStyle="#00ffcc";
    ctx.fillRect(x,y,50,altura);

    ctx.fillStyle="white";
    ctx.fillText(n.media.toFixed(1),x+15,y-5);
  });
}

/* LIMPAR TUDO */
function limparTudo(){
  if(confirm("Tem certeza que deseja apagar todos os dados?")){
    localStorage.removeItem("alunos");
    localStorage.removeItem("professores");
    localStorage.removeItem("notas");

    alunos=[];
    professores=[];
    notas=[];

    renderAlunos();
    renderProfessores();
    renderNotas();
    atualizarDashboard();
    showToast("Dados apagados!");
  }
}

/* EXPORTAR PDF */
function exportarPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.text("Relatório Escolar", 20, 20);

  let y = 30;

  doc.text("Alunos:", 20, y);
  y+=10;

  alunos.forEach(a=>{
    doc.text(`- ${a.nome} (${a.matricula})`, 25, y);
    y+=8;
  });

  y+=10;
  doc.text("Notas:", 20, y);
  y+=10;

  notas.forEach(n=>{
    doc.text(`- ${n.aluno} | Média: ${n.media.toFixed(1)}`, 25, y);
    y+=8;
  });

  doc.save("relatorio-escolar.pdf");
}
</script>

</body>
</html>
